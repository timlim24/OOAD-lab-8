# =============================================================================
# Redpanda (Kafka-compatible broker) + Redpanda Console
#   docker compose up -d
#   Console: http://localhost:8080
#   Broker:  localhost:19092   (from the host)
# =============================================================================
name: ooad-lab8

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1                     # 1 CPU core is plenty for 60 msg/s
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned           # tells Redpanda it shares the CPU with a
                                    # desktop; disables the busy-poll it would
                                    # otherwise use on dedicated hardware
      - --node-id 0
      - --check=false
      # Two listeners on purpose. A Kafka client first connects to a bootstrap
      # address, then the broker replies with the addresses of the actual
      # partition leaders. Inside Docker that reply must say "redpanda:9092";
      # from the host it must say "localhost:19092". One listener cannot be
      # both, which is why nearly every first attempt at Kafka-in-Docker hangs
      # on connect.
      - --kafka-addr      INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --pandaproxy-addr INTERNAL://0.0.0.0:8082,EXTERNAL://0.0.0.0:18082
      - --advertise-pandaproxy-addr INTERNAL://redpanda:8082,EXTERNAL://localhost:18082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"   # Kafka API
      - "18082:18082"   # HTTP proxy
      - "9644:9644"     # admin API / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v3.4.0
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Console runs inside the Docker network, so it uses the INTERNAL listener
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"

volumes:
  redpanda-data:
